<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Para desplegar tengo que coger el coche</title>

    <link rel="stylesheet" href="../lib/reveal.js-v4.3.1/dist/reset.css" />
    <link rel="stylesheet" href="../lib/reveal.js-v4.3.1/dist/reveal.css" />
    <link rel="stylesheet" href="../lib/reveal.js-v4.3.1/dist/theme/black.css" />

    <!-- Theme used for syntax highlighted code -->
    <link rel="stylesheet" href="../lib/reveal.js-v4.3.1/plugin/highlight/monokai.css" />

    <link href="../lib/fontawesome-free-6.6.0-web/css/fontawesome.min.css" rel="stylesheet" />
    <link href="../lib/fontawesome-free-6.6.0-web/css/brands.css" rel="stylesheet" />
    <link href="../lib/fontawesome-free-6.6.0-web/css/solid.css" rel="stylesheet" />
    <link href="../lib/fontawesome-free-6.6.0-web/css/regular.css" rel="stylesheet" />
    <!--
		 captions
		 https://stackoverflow.com/questions/19331362/using-an-image-caption-in-markdown-jekyll

     data separator
     https://github.com/hakimel/reveal.js/issues/1372

     estilo tablas
     https://github.com/hakimel/reveal.js/issues/1901
		 -->
    <style>
      figcaption {
        font-size: small;
        margin-top: -15px;
      }

      .container {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
      }

      .container4 img {
        max-width: 275px;
        max-height: 175px;
      }

      .col {
        flex: 1;
      }

      .container4 .col {
        display: flex;
        flex-direction: column;
        align-items: bottom;
      }

      <!-- https://css-tricks.com/quoting-in-html-quotations-citations-and-blockquotes/ ->>
blockquote::before {
        content: open-quote;
      }
      blockquote::after {
        content: close-quote;
      }

      blockquote {
        text-indent: -0.45em;
        quotes: "“" "”" "‘" "’";
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="README.md"
          data-separator-notes="^\?\?\?"
          data-separator="^---$"
          data-separator-vertical="^--$"
        ></section>
      </div>
    </div>

    <script src="../lib/reveal.js-v4.3.1/dist/reveal.js"></script>
    <script src="../lib/reveal.js-v4.3.1/plugin/notes/notes.js"></script>
    <script src="../lib/reveal.js-v4.3.1/plugin/markdown/markdown.js"></script>
    <script src="../lib/reveal.js-v4.3.1/plugin/highlight/highlight.js"></script>
    <script>
      // More info about initialization & config:
      // - https://revealjs.com/initialization/
      // - https://revealjs.com/config/
      Reveal.initialize({
        hash: true,

        // Learn about plugins: https://revealjs.com/plugins/
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
      });
    </script>
  </body>
</html>
